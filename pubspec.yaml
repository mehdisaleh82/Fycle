name: fycle
description: "Period tracker. Free, no ads, no account, nothing leaves the phone."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

# Every package here, direct or transitive, must be listed in
# tool/allowed_dependencies.txt. See CLAUDE.md, rule 4.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
