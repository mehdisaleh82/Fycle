name: fycle
description: "Period tracker. Free, no ads, no account, nothing leaves the phone."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

# Every package here, direct or transitive, must be listed in
# tool/allowed_dependencies.txt. See CLAUDE.md, rule 4.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  material_ui: ^1.1.0
  path_provider: ^2.1.6
  sqlite3: ^3.9.1
  file_picker: ^13.4.0
  flutter_local_notifications: 23.0.3
  local_auth: 3.0.2
  timezone: 0.11.2
  home_widget: 0.9.2
  pdf: ^3.13.1
  health: ^13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

# SQLite is bundled in its encrypted variant (SQLite3 Multiple Ciphers).
# The build downloads a precompiled library and checks its sha256 hash.
# See docs/DECISIONS.md, decision 24.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
