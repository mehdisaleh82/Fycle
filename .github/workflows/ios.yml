name: iOS TestFlight

# Builds the iPhone app on a Mac in the cloud and sends it to TestFlight.
# Started by hand (the "Run workflow" button) or by pushing a tag that
# starts with "ios-". Mac minutes are limited: this never runs on a plain
# push. See docs/DECISIONS.md, decisions 55 to 57.
on:
  workflow_dispatch:
  push:
    tags: ['ios-*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show the Xcode version
        run: xcodebuild -version

      # Same as ci.yml: the SDK comes from its official repository.
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Disable tool telemetry
        run: |
          flutter --disable-analytics
          dart --disable-analytics

      - run: flutter pub get

      # Compiles without signing. The build number must grow at each upload:
      # the run number of this workflow does. The app is told that number too:
      # it asks for reminders again once after each update (decision 137).
      - name: Build the app
        run: flutter build ipa --release --no-codesign --build-number="$GITHUB_RUN_NUMBER" --dart-define=FYCLE_BUILD="$GITHUB_RUN_NUMBER"

      - name: Check that the signing secrets exist
        id: secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are missing: the app was compiled but not sent to TestFlight."
          fi

      # Xcode signs the app and uploads it, with the App Store Connect key.
      # It creates the certificate and the profile itself. No other tool.
      - name: Sign and send to TestFlight
        if: steps.secrets.outputs.present == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key from the build machine
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
